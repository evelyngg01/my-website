
<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>evelyn derosia's page!</title>
  <style>
   div {
    width: 300px;
    height:300px;
    background: #ffdead;
    margin: 50px;
   }

   #static {
    background: #ff9c78;
    position: static;/* default position */
   }

   #sticky {
    background:#ff8181;
    position: sticky;/* static until hits edge */
   }

   #relative {
   background: rgb(247, 255, 164);
   position: relative; /* moves box but leaves hole */
   left: 100px;
   top: -100px;
   z-index: -10;
   }

   #fixed {
   background: #8effa3;
   position:fixed; /* stuck to screen, leaves no hole */
   top: 50px;
   right: 50px;
   }

   #absolute {
   background:#ebbaff;
   position: absolute; /* stuck to content, no hole */
   right: 30px;
   bottom: 50px;
   }
   
  </style>
</head>

<body>
  <div id="static"></div>
  <div id="sticky"></div>
  <div id="relative"></div>
  <div id="fixed"></div>
  <div id="absolute"></div>

</body>

</html>
